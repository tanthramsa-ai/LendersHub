server {
    listen 80;
    server_name api.lendershub.in;

    # Documents (photo, Aadhaar, promissory note) are uploaded inside the JSON body as
    # base64 — up to ~27 MB for a loan with two 10 MB files. nginx's 1 MB default would
    # reject them before they reach the backend (whose own limit is 30 MB).
    client_max_body_size 32m;

    # Proxy all API calls to the NestJS backend
    location /api/ {
        proxy_pass http://backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Everything else goes to the Next.js server
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
